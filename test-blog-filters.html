<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="assets/css/style.css">
  <title>Test Blog Filters</title>
</head>
<body class="blog">
  <main>
    <section class="blog-list">
      <div class="vacancies-filter">
        <div class="filter-buttons">
          <button class="filter-btn active" data-category="all">Все статьи</button>
          <button class="filter-btn" data-category="news">Новини</button>
          <button class="filter-btn" data-category="trends">Тренды</button>
          <button class="filter-btn" data-category="ideas">Идеи</button>
        </div>
      </div>

      <div class="vacancies-grid">
        <div class="vacancy-card" data-category="news">
          <div class="card">
            <img src="assets/images/img2-2.png" alt="">
            <div class="info">
              <h6>Новость 1</h6>
              <div class="content-wrapper">
                <p class="date">08.08.2025</p>
                <p>Текст Новини 1</p>
                <a href="" class="btn">Читати</a>
              </div>
            </div>
          </div>
        </div>

        <div class="vacancy-card" data-category="trends">
          <div class="card">
            <img src="assets/images/img2-2.png" alt="">
            <div class="info">
              <h6>Тренд 1</h6>
              <div class="content-wrapper">
                <p class="date">08.08.2025</p>
                <p>Текст тренда 1</p>
                <a href="" class="btn">Читати</a>
              </div>
            </div>
          </div>
        </div>

        <div class="vacancy-card" data-category="ideas">
          <div class="card">
            <img src="assets/images/img2-2.png" alt="">
            <div class="info">
              <h6>Идея 1</h6>
              <div class="content-wrapper">
                <p class="date">08.08.2025</p>
                <p>Текст идеи 1</p>
                <a href="" class="btn">Читати</a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="assets/js/all.js"></script>
</body>
</html>
